name: Deploy static dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build family schedules
        run: npm run build:schedules

      - name: Refresh electricity prices
        id: electricity
        run: npm run update:electricity
        continue-on-error: true

      - name: Report electricity refresh failure
        if: steps.electricity.outcome == 'failure'
        run: echo '::warning::Electricity refresh failed. Dashboard will mark expired prices unavailable.'

      - name: Commit refreshed electricity prices
        continue-on-error: true
        if: steps.electricity.outcome == 'success'
        run: |
          if git diff --quiet -- data/electricity/fi-prices.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/electricity/fi-prices.json
          git commit -m 'Update Finnish electricity prices'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
